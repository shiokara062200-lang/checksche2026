<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール＆チェックリスト連携アプリ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'schedule-sync-app';
    const firebaseConfig = {
      apiKey: "AIzaSyC3ItczFJKx8C-qNO8t0D4ycZNNDvGifmc",
      authDomain: "checklist-schedule.firebaseapp.com",
      projectId: "checklist-schedule",
      storageBucket: "checklist-schedule.firebasestorage.app",
      messagingSenderId: "27095356750",
      appId: "1:27095356750:web:647eff472b237d19903a1f",
      measurementId: "G-5C4K59L9E1"
    };

    let db = null;
    let auth = null;
    let currentUser = null;
    let initPromise = null;

    window.initFirebaseSync = async () => {
      if (initPromise) return initPromise;
      initPromise = (async () => {
        if (!firebaseConfig || !firebaseConfig.apiKey) {
          console.warn("Firebase config is missing or invalid.");
          return null;
        }
        try {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              const cred = await signInWithCustomToken(auth, __initial_auth_token);
              currentUser = cred.user;
            } else {
              const cred = await signInAnonymously(auth);
              currentUser = cred.user;
            }
          } catch (authErr) {
            console.warn("トークン認証に失敗したため、匿名認証にフォールバックします:", authErr);
            const cred = await signInAnonymously(auth);
            currentUser = cred.user;
          }
          
          window.currentFirebaseUid = currentUser.uid;
          return { db, auth, currentUser, appId };
        } catch (e) {
          console.error("Firebase Auth Error:", e);
          return null;
        }
      })();
      return initPromise;
    };

    window.initFirebaseSync();

    window.AnonymousSyncEngine = {
      isConfigured() {
        return !!(firebaseConfig && firebaseConfig.apiKey);
      },

      async sendSlotData(slotCode, payload) {
        const conn = await window.initFirebaseSync();
        if (!conn || !db || !currentUser) {
          throw new Error("Firebaseが未設定または認証に失敗しました。");
        }
        
        const slotDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_slots', slotCode);
        await setDoc(slotDocRef, {
          updatedAt: new Date().toISOString(),
          senderUid: currentUser.uid,
          payload: payload
        });
      },

      listenSlotData(slotCode, onDataReceived, onError) {
        let unsubscribe = null;
        let isCancelled = false;

        window.initFirebaseSync().then((conn) => {
          if (isCancelled) return;
          if (!conn || !db) {
            if (onError) onError(new Error("Firebase未設定"));
            return;
          }

          const slotDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_slots', slotCode);
          unsubscribe = onSnapshot(slotDocRef, (snapshot) => {
            if (snapshot.exists()) {
              const data = snapshot.data();
              onDataReceived(data);
            }
          }, (err) => {
            console.error("Sync listen error:", err);
            if (onError) onError(err);
          });
        }).catch(err => {
          if (onError) onError(err);
        });

        return () => {
          isCancelled = true;
          if (unsubscribe) unsubscribe();
        };
      }
    };
  </script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0; padding: 0; overflow: hidden;
      user-select: none;
    }
    .completed-task {
      opacity: 0.45;
      text-decoration: line-through;
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      transition: all 0.2s ease;
    }
    .active-task {
      transition: all 0.2s ease;
    }
    .active-task:active { transform: scale(0.99); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .time-slot-row {
      height: 24px;
      box-sizing: border-box;
    }
    .time-slot-hour-start {
      border-top: 2px solid #1e293b !important;
    }
    @keyframes pulse-light {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-fast {
      animation: pulse-light 0.8s infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const defaultTemplates = {
      restriction: [
        { id: 'r1', day: '前準備', timeStart: '-', timeEnd: '', task: '表紙、サブジェクトNo.、セッションNo.記入欄の確認', checked: false },
        { id: 'r2', day: '1日目', timeStart: '17:00', timeEnd: '18:00', task: '身長・体重測定', checked: false },
        { id: 'r3', day: '1日目', timeStart: '19:00', timeEnd: '20:40', task: '手続き記憶 or 陳述記憶 課題', checked: false },
        { id: 'r4', day: '1日目', timeStart: '21:00', timeEnd: '21:30', task: 'PSG装着', checked: false },
        { id: 'r5', day: '1日目', timeStart: '22:00', timeEnd: '', task: '消灯 (室温22.00℃)', checked: false },
        { id: 'r6', day: '2日目', timeStart: '08:00', timeEnd: '08:30', task: 'PVT① セッションNo.: [セッション:4:1]', checked: false },
        { id: 'r7', day: '2日目', timeStart: '11:00', timeEnd: '11:30', task: 'PVT② セッションNo.: [セッション:4:2]', checked: false },
      ]
    };

    const DEFAULT_DAYS = ['前準備', '1日目', '2日目', '3日目', '4日目', '最終日'];

    const TIME_OPTIONS = ['-'];
    // 00:00 から 47:55 (48時間・2日分の通し時間) まで拡張し、日またぎに対応
    for (let h = 0; h < 48; h++) {
      for (let m = 0; m < 60; m += 5) {
        const hh = h.toString().padStart(2, '0');
        const mm = m.toString().padStart(2, '0');
        TIME_OPTIONS.push(`${hh}:${mm}`);
      }
    }

    const COLORS = ['blue', 'indigo', 'purple', 'emerald', 'amber', 'rose', 'teal'];
    const generateId = () => Math.random().toString(36).substring(2, 9);

    const processPlaceholders = (text, subject) => {
      if (!text || !subject) return text || "";
      let processed = text;
      
      const subjectId = subject.subjectId || "";
      const subjectNo = subject.subjectNo || "";
      
      const idMatch = subjectId.match(/\d+/);
      const idNum = idMatch ? parseInt(idMatch[0], 10).toString() : "0";
      
      processed = processed.replace(/{{SUBJECT_ID}}/g, subjectId);
      //【ナビゲーションパス】
      //被験者識別子
      processed = processed.replace(/\[被験者ID\]/g, subjectId);
      processed = processed.replace(/\[サブジェクト\]/g, subjectNo);
      processed = processed.replace(/{{:(\d+):(\d+)}}/g, (match, day, count) => `${idNum}${day}${count}`);
      processed = processed.replace(/\[:(\d+):(\d+)\]/g, (match, day, count) => `${idNum}${day}${count}`);
      
      return processed;
    };

    const timeToMinutes = (t) => {
      if (!t || t === '-') return -1;
      const match = t.match(/(\d{1,2}):(\d{2})/);
      if (match) return parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
      return -1;
    };

    const exportToExcel = (tasks, subjects) => {
      const data = tasks.map(t => {
        const subj = subjects.find(s => s.id === t.subjectId) || {};
        const timeDisplay = t.timeEnd ? `${t.timeStart}-${t.timeEnd}` : t.timeStart;
        const visibilityJa = t.visibility === 'schedule_only' ? 'スケジュールのみ' : t.visibility === 'checklist_only' ? 'チェックリストのみ' : '両方表示';
        return {
          "被験者氏名": subj.name || "",
          "被験者ID": subj.subjectId || "",
          "サブジェクトNo": subj.subjectNo || "",
          "日/フェーズ": t.day,
          "時間": timeDisplay,
          "タスク内容": processPlaceholders(t.task, subj),
          "表示先": visibilityJa,
          "ステータス": t.checked ? "完了" : "未完了",
          "メモ": t.memo || ""
        };
      });
      
      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Checklist");
      
      const d = new Date();
      const dateStr = `${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}`;
      XLSX.writeFile(workbook, `実験スケジュール_${dateStr}.xlsx`);
    };

    const Modal = ({ isOpen, title, message, onConfirm, onCancel, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h3 className="text-xl font-bold mb-3 text-gray-800">{title}</h3>
            {message && <p className="text-gray-600 mb-5 text-sm">{message}</p>}
            {children && <div className="mb-5">{children}</div>}
            <div className="flex justify-end space-x-3">
              <button onClick={onCancel} className="px-4 py-2 rounded-lg text-gray-600 bg-gray-100 hover:bg-gray-200 text-sm font-medium">キャンセル</button>
              {onConfirm && <button onClick={onConfirm} className="px-4 py-2 rounded-lg text-white bg-blue-600 hover:bg-blue-700 text-sm font-medium">OK</button>}
            </div>
          </div>
        </div>
      );
    };

    const TaskItem = ({ task, subject, viewType, onToggle, onUpdateTask, showSubjectLabel }) => {
      const timeDisplay = task.timeEnd && task.timeEnd !== '-' ? `${task.timeStart} - ${task.timeEnd}` : task.timeStart;
      const parsedTask = processPlaceholders(task.task, subject);
      const color = subject?.color || 'blue';

      return (
        <div 
          onClick={() => onToggle(task.id)}
          className={`flex flex-col p-3.5 mb-2 rounded-xl border-2 cursor-pointer transition-all duration-150 ${
            task.checked 
              ? 'completed-task border-gray-200' 
              : `active-task bg-white border-gray-200 hover:border-${color}-400 hover:shadow`
          }`}
        >
          <div className="flex items-center w-full">
            <div className="flex-shrink-0 mr-3">
              <div className={`w-6 h-6 rounded-md flex items-center justify-center border-2 transition-colors ${
                task.checked ? `bg-${color}-500 border-${color}-500 text-white` : 'border-gray-300 bg-white'
              }`}>
                {task.checked && <i className="fa-solid fa-check text-xs"></i>}
              </div>
            </div>

            <div className="w-28 flex-shrink-0 mr-3">
              <span className={`text-xs font-mono font-bold px-2 py-1 rounded border inline-block ${
                task.checked ? 'bg-gray-100 text-gray-400 border-gray-200' : 'bg-gray-50 text-gray-700 border-gray-200'
              }`}>
                {timeDisplay || '-'}
              </span>
            </div>

            <div className="flex-1 min-w-0 pr-2">
              <div className="flex items-center space-x-2">
                {showSubjectLabel && subject && (
                  <span className={`text-xs px-2 py-0.5 rounded font-bold bg-${color}-100 text-${color}-800`}>
                    {subject.name || subject.subjectId}
                  </span>
                )}
                <span className={`text-sm font-semibold truncate ${task.checked ? 'text-gray-400' : 'text-gray-800'}`}>
                  {parsedTask}
                </span>
              </div>
            </div>
          </div>

          {viewType === 'checklist' && (
            <div className="mt-2.5 ml-9 pl-0.5 pr-2" onClick={e => e.stopPropagation()}>
              <input
                type="text"
                placeholder="メモを追加... (タップして入力)"
                value={task.memo || ''}
                onChange={(e) => onUpdateTask && onUpdateTask(task.id, 'memo', e.target.value)}
                className={`w-full text-xs p-2 border border-transparent rounded-lg focus:outline-none focus:border-gray-300 focus:bg-white transition-colors ${task.checked ? 'bg-transparent text-gray-400 placeholder-gray-300' : 'bg-gray-50 text-gray-700 hover:bg-gray-100 placeholder-gray-400'}`}
              />
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [subjects, setSubjects] = React.useState(() => {
        const saved = localStorage.getItem('app_v3_subjects');
        return saved ? JSON.parse(saved) : [
          { id: 'subj_1', name: '被験者A', subjectId: 'FANS010', subjectNo: '10', color: 'blue' },
          { id: 'subj_2', name: '被験者B', subjectId: 'FANS011', subjectNo: '11', color: 'indigo' }
        ];
      });

      const [tasks, setTasks] = React.useState(() => {
        const saved = localStorage.getItem('app_v3_tasks');
        return saved ? JSON.parse(saved) : defaultTemplates.restriction.map(t => ({ ...t, subjectId: 'subj_1' }));
      });

      const [availableDays, setAvailableDays] = React.useState(() => {
        const saved = localStorage.getItem('app_v3_days');
        return saved ? JSON.parse(saved) : DEFAULT_DAYS;
      });

      const [selectedSubjectId, setSelectedSubjectId] = React.useState(subjects[0]?.id || 'subj_1');
      const [selectedDay, setSelectedDay] = React.useState('1日目');
      const [viewType, setViewType] = React.useState('schedule');
      const [displayMode, setDisplayMode] = React.useState('individual');
      const [isEditMode, setIsEditMode] = React.useState(false);
      const [modalConfig, setModalConfig] = React.useState({ isOpen: false });
      
      const fileInputRef = React.useRef(null);
      const individualFileInputRef = React.useRef(null);

      const [syncSlotCode, setSyncSlotCode] = React.useState('');
      const [activeSlotCode, setActiveSlotCode] = React.useState(() => localStorage.getItem('app_v3_sync_slot') || '');
      const [isSyncActive, setIsSyncActive] = React.useState(() => localStorage.getItem('app_v3_sync_active') === 'true' && !!localStorage.getItem('app_v3_sync_slot'));
      const [syncStatus, setSyncStatus] = React.useState('idle');
      const [syncErrorMessage, setSyncErrorMessage] = React.useState('');
      const [isMaskingEnabled, setIsMaskingEnabled] = React.useState(true);
      const [toastMessage, setToastMessage] = React.useState(null);

      const isRemoteLockRef = React.useRef(false);
      const remoteLockTimerRef = React.useRef(null);

      React.useEffect(() => { localStorage.setItem('app_v3_subjects', JSON.stringify(subjects)); }, [subjects]);
      React.useEffect(() => { localStorage.setItem('app_v3_tasks', JSON.stringify(tasks)); }, [tasks]);
      React.useEffect(() => { localStorage.setItem('app_v3_days', JSON.stringify(availableDays)); }, [availableDays]);

      React.useEffect(() => {
        if (activeSlotCode) {
          localStorage.setItem('app_v3_sync_slot', activeSlotCode);
        } else {
          localStorage.removeItem('app_v3_sync_slot');
        }
        localStorage.setItem('app_v3_sync_active', isSyncActive ? 'true' : 'false');
      }, [activeSlotCode, isSyncActive]);

      React.useEffect(() => {
        if (!subjects.find(s => s.id === selectedSubjectId) && subjects.length > 0) {
          setSelectedSubjectId(subjects[0].id);
        }
      }, [subjects, selectedSubjectId]);

      React.useEffect(() => {
        if (!availableDays.includes(selectedDay) && availableDays.length > 0) {
          setSelectedDay(availableDays[0]);
        }
      }, [availableDays]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const prepareAnonymizedPayload = () => {
        const anonymizedSubjects = subjects.map((s, idx) => ({
          id: s.id,
          name: isMaskingEnabled ? `被験者${idx + 1}` : s.name,
          subjectId: isMaskingEnabled ? `SUBJ-${(idx + 1).toString().padStart(2, '0')}` : s.subjectId,
          subjectNo: s.subjectNo,
          color: s.color
        }));

        return {
          tasks: tasks,
          subjects: anonymizedSubjects,
          days: availableDays,
          timestamp: Date.now()
        };
      };

      React.useEffect(() => {
        if (!isSyncActive || !activeSlotCode) return;
        if (isRemoteLockRef.current) return;

        if (!window.AnonymousSyncEngine?.isConfigured()) {
          setSyncStatus('unconfigured');
          setSyncErrorMessage('Firebaseの設定情報がindex.htmlに組み込まれていません。');
          return;
        }

        const timer = setTimeout(async () => {
          try {
            setSyncStatus('connecting');
            const payload = prepareAnonymizedPayload();
            if (window.AnonymousSyncEngine) {
              await window.AnonymousSyncEngine.sendSlotData(activeSlotCode, payload);
              setSyncStatus('synced');
              setSyncErrorMessage('');
            }
          } catch (e) {
            console.error("Slot upload error:", e);
            setSyncStatus('error');
            setSyncErrorMessage(e.message || 'データ送信に失敗しました');
          }
        }, 500);

        return () => clearTimeout(timer);
      }, [tasks, subjects, availableDays, isSyncActive, activeSlotCode, isMaskingEnabled]);

      React.useEffect(() => {
        if (!isSyncActive || !activeSlotCode) return;

        if (!window.AnonymousSyncEngine?.isConfigured()) {
          setSyncStatus('unconfigured');
          setSyncErrorMessage('Firebaseの設定情報がindex.htmlに組み込まれていません。');
          return;
        }

        setSyncStatus('connecting');
        const unsubscribe = window.AnonymousSyncEngine?.listenSlotData(
          activeSlotCode,
          (remoteData) => {
            if (!remoteData || !remoteData.payload) return;

            if (remoteData.senderUid && window.currentFirebaseUid && remoteData.senderUid === window.currentFirebaseUid) {
              setSyncStatus('synced');
              return;
            }

            const { tasks: rTasks, subjects: rSubjects, days: rDays } = remoteData.payload;

            isRemoteLockRef.current = true;
            if (remoteLockTimerRef.current) clearTimeout(remoteLockTimerRef.current);
            remoteLockTimerRef.current = setTimeout(() => {
              isRemoteLockRef.current = false;
            }, 1500);

            if (rTasks) setTasks(rTasks);
            if (rDays) setAvailableDays(rDays);

            if (rSubjects) {
              setSubjects(prev => {
                return prev.map(s => {
                  const match = rSubjects.find(rs => rs.id === s.id);
                  return match ? { ...s, color: match.color || s.color } : s;
                });
              });
            }

            setSyncStatus('synced');
            setSyncErrorMessage('');
            showToast('🔄 相手の変更を受信・反映しました');
          },
          (err) => {
            setSyncStatus('error');
            setSyncErrorMessage('データベース接続エラー：設定を確認してください。');
          }
        );

        return () => {
          if (typeof unsubscribe === 'function') unsubscribe();
        };
      }, [isSyncActive, activeSlotCode]);

      const handleExportTemplateClick = () => {
        setModalConfig({
          isOpen: true,
          title: 'テンプレートの保存 (CSV)',
          message: '現在の被験者設定、タスクスケジュール、フェーズ設定をCSVファイルとして保存します。Excel等で開いて横並びで編集可能です。',
          content: (
            <div>
              <label className="text-xs font-bold text-gray-500 mb-2 block">保存するファイル名:</label>
              <input 
                type="text"
                id="export-filename"
                className="w-full border-2 border-gray-300 rounded-lg p-2.5 text-sm font-bold focus:border-blue-500 outline-none"
                defaultValue={`schedule_template_${new Date().toISOString().slice(0, 10)}.csv`}
              />
            </div>
          ),
          onConfirm: () => {
            const input = document.getElementById('export-filename');
            let filename = input ? input.value.trim() : 'template.csv';
            if (!filename) filename = 'template.csv';
            if (!filename.endsWith('.csv')) filename += '.csv';

            const exportData = tasks.map(t => {
              const subj = subjects.find(s => s.id === t.subjectId) || {};
              const visibilityJa = t.visibility === 'schedule_only' ? 'スケジュールのみ' : t.visibility === 'checklist_only' ? 'チェックリストのみ' : '両方表示';
              return {
                "タスクID": t.id,
                "被験者内部ID": subj.id || t.subjectId,
                "被験者名": subj.name || "",
                "被験者ID": subj.subjectId || "",
                "サブジェクトNo": subj.subjectNo || "",
                "色": subj.color || "blue",
                "フェーズ": t.day,
                "開始時刻": t.timeStart,
                "終了時刻": t.timeEnd,
                "タスク内容": t.task,
                "表示先": visibilityJa,
                "メモ": t.memo || ""
              };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const csvStr = XLSX.utils.sheet_to_csv(worksheet);
            
            // Excelで文字化けしないようBOM付きUTF-8にする
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvStr], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setModalConfig({ isOpen: false });
            showToast('✅ テンプレート(CSV)を保存しました');
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const handleImportTemplateClick = () => {
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            if (jsonData && jsonData.length > 0) {
              const newSubjectsMap = new Map();
              const newTasks = [];
              const newDaysSet = new Set();
              
              jsonData.forEach(row => {
                const taskId = row["タスクID"] || generateId();
                let subjId = row["被験者内部ID"];
                const subjName = row["被験者名"] || "被験者";
                
                if (!subjId) {
                   const existingKey = Array.from(newSubjectsMap.keys()).find(k => newSubjectsMap.get(k).name === subjName);
                   if (existingKey) {
                       subjId = existingKey;
                   } else {
                       subjId = generateId();
                   }
                }

                if (!newSubjectsMap.has(subjId)) {
                  newSubjectsMap.set(subjId, {
                    id: subjId,
                    name: subjName,
                    subjectId: row["被験者ID"] || "",
                    subjectNo: row["サブジェクトNo"] != null ? String(row["サブジェクトNo"]) : "",
                    color: row["色"] || COLORS[newSubjectsMap.size % COLORS.length]
                  });
                }

                const day = row["フェーズ"] || "1日目";
                newDaysSet.add(day);

                let visibility = 'both';
                if (row["表示先"] === 'スケジュールのみ') visibility = 'schedule_only';
                if (row["表示先"] === 'チェックリストのみ') visibility = 'checklist_only';

                newTasks.push({
                  id: taskId,
                  subjectId: subjId,
                  day: day,
                  timeStart: row["開始時刻"] || "-",
                  timeEnd: row["終了時刻"] || "",
                  task: row["タスク内容"] || "",
                  visibility: visibility,
                  memo: row["メモ"] || "",
                  checked: false
                });
              });

              if (newTasks.length > 0) {
                  setSubjects(Array.from(newSubjectsMap.values()));
                  setTasks(newTasks);
                  setAvailableDays(Array.from(newDaysSet));
                  setSelectedSubjectId(Array.from(newSubjectsMap.values())[0].id);
                  setSelectedDay(Array.from(newDaysSet)[0]);
                  showToast('✅ テンプレート(CSV)を読み込みました');
              } else {
                  alert("有効なタスクデータが見つかりませんでした。");
              }
            } else {
              alert("無効または空のCSVファイルです。");
            }
          } catch (error) {
            alert("ファイルの読み込みに失敗しました。CSV形式を確認してください。");
            console.error(error);
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const handleExportIndividualTemplate = () => {
        const subject = subjects.find(s => s.id === selectedSubjectId);
        if (!subject) return;

        const individualTasks = tasks.filter(t => t.subjectId === selectedSubjectId);
        
        setModalConfig({
          isOpen: true,
          title: `${subject.name} のタスクテンプレート保存 (CSV)`,
          message: 'この被験者のタスク設定のみをCSVファイルとして保存します。',
          content: (
            <div>
              <label className="text-xs font-bold text-gray-500 mb-2 block">保存するファイル名:</label>
              <input 
                type="text"
                id="export-indiv-filename"
                className="w-full border-2 border-gray-300 rounded-lg p-2.5 text-sm font-bold focus:border-blue-500 outline-none"
                defaultValue={`task_template_${subject.subjectId || subject.name}.csv`}
              />
            </div>
          ),
          onConfirm: () => {
            const input = document.getElementById('export-indiv-filename');
            let filename = input ? input.value.trim() : 'task_template.csv';
            if (!filename) filename = 'task_template.csv';
            if (!filename.endsWith('.csv')) filename += '.csv';

            const exportData = individualTasks.map(t => {
              const visibilityJa = t.visibility === 'schedule_only' ? 'スケジュールのみ' : t.visibility === 'checklist_only' ? 'チェックリストのみ' : '両方表示';
              return {
                "フェーズ": t.day,
                "開始時刻": t.timeStart,
                "終了時刻": t.timeEnd,
                "タスク内容": t.task,
                "表示先": visibilityJa,
                "メモ": t.memo || ""
              };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const csvStr = XLSX.utils.sheet_to_csv(worksheet);
            
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvStr], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setModalConfig({ isOpen: false });
            showToast(`✅ ${subject.name} のテンプレート(CSV)を保存しました`);
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const handleImportIndividualTemplateClick = () => {
        if (individualFileInputRef.current) {
          individualFileInputRef.current.click();
        }
      };

      const handleIndividualFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            if (jsonData && jsonData.length > 0) {
              const newTasks = jsonData.map(row => {
                let visibility = 'both';
                if (row["表示先"] === 'スケジュールのみ') visibility = 'schedule_only';
                if (row["表示先"] === 'チェックリストのみ') visibility = 'checklist_only';
                return {
                  id: generateId(),
                  subjectId: selectedSubjectId,
                  day: row["フェーズ"] || "1日目",
                  timeStart: row["開始時刻"] || "-",
                  timeEnd: row["終了時刻"] || "",
                  task: row["タスク内容"] || "",
                  visibility: visibility,
                  memo: row["メモ"] || "",
                  checked: false
                };
              });

              const newDays = [...availableDays];
              newTasks.forEach(t => {
                if (!newDays.includes(t.day)) {
                  newDays.push(t.day);
                }
              });

              const otherTasks = tasks.filter(t => t.subjectId !== selectedSubjectId);
              
              setTasks([...otherTasks, ...newTasks]);
              if (newDays.length > availableDays.length) {
                setAvailableDays(newDays);
              }
              
              showToast('✅ テンプレート(CSV)からタスクを読み込みました');
            } else {
              alert("無効または空のCSVファイルです。");
            }
          } catch (error) {
            alert("ファイルの読み込みに失敗しました。CSV形式を確認してください。");
            console.error(error);
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const generateSlotCode = () => Math.floor(100000 + Math.random() * 900000).toString();

      const openSyncModal = () => {
        const defaultCode = activeSlotCode || generateSlotCode();
        setSyncSlotCode(defaultCode);
        const isConfigured = window.AnonymousSyncEngine?.isConfigured();

        setModalConfig({
          isOpen: true,
          title: '匿名スロット同期の設定',
          content: (
            <div className="space-y-4 text-sm text-gray-600">
              {!isConfigured && (
                <div className="bg-red-50 border border-red-200 p-3 rounded-xl text-red-800 text-xs leading-relaxed">
                  <i className="fa-solid fa-triangle-exclamation mr-1.5 text-red-600 font-bold"></i>
                  <b>Firebase接続未設定:</b> <code>index.html</code> 内の <code>firebaseConfig</code> が設定されていません。
                </div>
              )}

              <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-emerald-800 text-xs leading-relaxed">
                <i className="fa-solid fa-user-shield mr-1.5 text-emerald-600"></i>
                <b>個人情報保護モード:</b> 氏名や実際の被験者IDはサーバーに送信されず、仮名化された進捗・時間データのみ同期されます。
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1">6桁の同期スロットコード</label>
                <div className="flex space-x-2">
                  <input 
                    type="text"
                    maxLength={6}
                    id="sync-code-input"
                    defaultValue={defaultCode}
                    className="flex-1 border-2 border-gray-300 rounded-lg px-3 py-2 text-center text-lg font-mono font-bold tracking-widest focus:border-blue-500 outline-none"
                    placeholder="123456"
                  />
                  <button 
                    type="button"
                    onClick={() => {
                      const code = generateSlotCode();
                      const input = document.getElementById('sync-code-input');
                      if (input) input.value = code;
                    }}
                    className="px-3 py-2 bg-gray-100 hover:bg-gray-200 font-bold rounded-lg text-xs text-gray-700 transition"
                  >
                    再発行
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-200">
                <div>
                  <div className="font-bold text-xs text-gray-800">個人情報の送信をスキップ</div>
                  <div className="text-[11px] text-gray-400">氏名・被験者IDを仮名化して同期</div>
                </div>
                <input 
                  type="checkbox"
                  defaultChecked={isMaskingEnabled}
                  id="masking-toggle"
                  className="w-4 h-4 accent-blue-600 rounded cursor-pointer"
                />
              </div>

              {isSyncActive && (
                <div className="text-center pt-1">
                  <span className="text-xs text-emerald-600 font-bold flex items-center justify-center">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping mr-1.5"></span>
                    現在スロット #{activeSlotCode} とリアルタイム同期中
                  </span>
                </div>
              )}
            </div>
          ),
          onConfirm: () => {
            const codeInput = document.getElementById('sync-code-input')?.value?.trim();
            const maskCheck = document.getElementById('masking-toggle')?.checked;

            if (!codeInput || codeInput.length < 4) {
              alert("有効なコードを入力してください");
              return;
            }

            setIsMaskingEnabled(!!maskCheck);
            setActiveSlotCode(codeInput);
            setIsSyncActive(true);
            setModalConfig({ isOpen: false });
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const stopSync = () => {
        setIsSyncActive(false);
        setActiveSlotCode('');
        setSyncStatus('idle');
        setSyncErrorMessage('');
      };

      const handleAddSubject = () => {
        const newId = generateId();
        const color = COLORS[subjects.length % COLORS.length];
        const newNum = (subjects.length + 10).toString().padStart(3, '0');
        const newSubjNo = (subjects.length + 10).toString();
        setSubjects([...subjects, { id: newId, name: `被験者${String.fromCharCode(65 + subjects.length)}`, subjectId: `FANS${newNum}`, subjectNo: newSubjNo, color }]);
        setSelectedSubjectId(newId);
      };

      const handleUpdateSubject = (id, field, value) => {
        setSubjects(subjects.map(s => s.id === id ? { ...s, [field]: value } : s));
      };

      const handleDeleteSubject = (idToDelete) => {
        if (subjects.length <= 1) {
          setModalConfig({
            isOpen: true,
            title: '削除不可',
            message: '少なくとも1人の被験者が必要です。',
            onCancel: () => setModalConfig({ isOpen: false })
          });
          return;
        }

        const subjectTasks = tasks.filter(t => t.subjectId === idToDelete);
        
        setModalConfig({
          isOpen: true,
          title: '被験者の削除',
          message: subjectTasks.length > 0 
            ? `この被験者には${subjectTasks.length}件のタスクが存在します。被験者と関連タスクをすべて削除してもよろしいですか？`
            : `この被験者を削除してもよろしいですか？`,
          onConfirm: () => {
            const newSubjects = subjects.filter(s => s.id !== idToDelete);
            setSubjects(newSubjects);
            setTasks(prevTasks => prevTasks.filter(t => t.subjectId !== idToDelete));
            
            if (selectedSubjectId === idToDelete) {
              setSelectedSubjectId(newSubjects[0].id);
            }
            setModalConfig({ isOpen: false });
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const handleToggleTask = (id) => {
        if (isEditMode) return;
        setTasks(tasks.map(t => t.id === id ? { ...t, checked: !t.checked } : t));
      };

      const handleToggleTaskGroup = (ids) => {
        if (isEditMode) return;
        const targetTasks = tasks.filter(t => ids.includes(t.id));
        const allChecked = targetTasks.length > 0 && targetTasks.every(t => t.checked);
        setTasks(tasks.map(t => ids.includes(t.id) ? { ...t, checked: !allChecked } : t));
      };

      const handleUpdateTask = (id, field, value) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, [field]: value } : t));
      };

      const openAddDayModal = (taskId) => {
        setModalConfig({
          isOpen: true,
          title: '新しい 日/フェーズ の追加',
          content: (
            <div>
              <label className="text-xs font-bold text-gray-500 mb-2 block">フェーズ名 (例: 5日目, 予備日等):</label>
              <input 
                type="text" 
                id="new-day-name-field"
                className="w-full border-2 border-gray-300 rounded-lg p-2.5 text-sm font-bold focus:border-blue-500 outline-none"
                placeholder="新しい名称を入力"
              />
            </div>
          ),
          onConfirm: () => {
            const trimmed = document.getElementById('new-day-name-field')?.value?.trim();
            if (trimmed) {
              if (!availableDays.includes(trimmed)) {
                setAvailableDays([...availableDays, trimmed]);
              }
              if (taskId) {
                handleUpdateTask(taskId, 'day', trimmed);
              }
              setSelectedDay(trimmed);
            }
            setModalConfig({ isOpen: false });
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const handleDayChange = (taskId, value) => {
        if (value === '__ADD_NEW__') {
          openAddDayModal(taskId);
        } else {
          handleUpdateTask(taskId, 'day', value);
        }
      };

      const handleAddTask = (subjectId) => {
        setTasks([...tasks, { 
          id: generateId(), 
          subjectId, 
          day: selectedDay || availableDays[0] || '1日目', 
          timeStart: '08:00', 
          timeEnd: '09:00', 
          task: '', 
          visibility: 'both',
          checked: false 
        }]);
      };

      const handleDuplicateTask = (task) => {
        const newTask = { ...task, id: generateId() };
        const index = tasks.findIndex(t => t.id === task.id);
        const newTasks = [...tasks];
        newTasks.splice(index + 1, 0, newTask);
        setTasks(newTasks);
      };

      const handleDeleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const handleDeleteDay = (dayToDelete) => {
        if (availableDays.length <= 1) {
          setModalConfig({
            isOpen: true,
            title: '削除不可',
            message: '少なくとも1つのフェーズが必要です。すべてのフェーズを削除することはできません。',
            onCancel: () => setModalConfig({ isOpen: false })
          });
          return;
        }

        const tasksInDay = tasks.filter(t => t.day === dayToDelete);
        
        setModalConfig({
          isOpen: true,
          title: 'フェーズの削除',
          message: tasksInDay.length > 0 
            ? `「${dayToDelete}」には${tasksInDay.length}件のタスクが存在します。フェーズと関連タスクをすべて削除してもよろしいですか？`
            : `フェーズ「${dayToDelete}」を削除してもよろしいですか？`,
          onConfirm: () => {
            const newDays = availableDays.filter(d => d !== dayToDelete);
            setAvailableDays(newDays);
            setTasks(prevTasks => prevTasks.filter(t => t.day !== dayToDelete));
            
            if (selectedDay === dayToDelete) {
              setSelectedDay(newDays[0]);
            }
            setModalConfig({ isOpen: false });
          },
          onCancel: () => setModalConfig({ isOpen: false })
        });
      };

      const handleMoveDay = (index, direction) => {
        if (direction === -1 && index > 0) {
          const newDays = [...availableDays];
          const temp = newDays[index - 1];
          newDays[index - 1] = newDays[index];
          newDays[index] = temp;
          setAvailableDays(newDays);
        } else if (direction === 1 && index < availableDays.length - 1) {
          const newDays = [...availableDays];
          const temp = newDays[index + 1];
          newDays[index + 1] = newDays[index];
          newDays[index] = temp;
          setAvailableDays(newDays);
        }
      };

      const render5MinTimelineSchedule = (targetSubjectIds) => {
        const activeSubjs = subjects.filter(s => targetSubjectIds.includes(s.id));
        // スケジュール表では「チェックリストのみ」に設定されたタスクを除外して描画する
        const dayTasks = tasks.filter(t => t.day === selectedDay && targetSubjectIds.includes(t.subjectId) && t.visibility !== 'checklist_only');

        let minMin = 8 * 60;
        let maxMin = 20 * 60;

        dayTasks.forEach(t => {
          const start = timeToMinutes(t.timeStart);
          const end = timeToMinutes(t.timeEnd);
          if (start >= 0) minMin = Math.min(minMin, Math.floor(start / 60) * 60);
          if (end >= 0) maxMin = Math.max(maxMin, Math.ceil(end / 60) * 60);
        });
        
        minMin = Math.max(0, minMin - 30);
        maxMin = Math.min(48 * 60 - 5, maxMin + 60);

        const slots = [];
        for (let m = minMin; m <= maxMin; m += 5) {
          const hh = Math.floor(m / 60).toString().padStart(2, '0');
          const mm = (m % 60).toString().padStart(2, '0');
          slots.push({ timeStr: `${hh}:${mm}`, minutes: m, isHourStart: m % 60 === 0 });
        }

        const unassignedTasks = dayTasks.filter(t => timeToMinutes(t.timeStart) < 0);

        const onDragStart = (e, taskIds) => {
          e.dataTransfer.setData('application/json', JSON.stringify(taskIds));
          e.dataTransfer.effectAllowed = 'move';
        };

        const onDragOver = (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        };

        const onDrop = (e, targetSubjectId) => {
          e.preventDefault();
          let taskIds;
          try {
            taskIds = JSON.parse(e.dataTransfer.getData('application/json'));
          } catch(err) {
            const id = e.dataTransfer.getData('text/plain');
            if (id) taskIds = [id];
          }
          if (!taskIds || !taskIds.length) return;

          const container = e.currentTarget;
          const rect = container.getBoundingClientRect();
          const y = e.clientY - rect.top;

          const minutesFromTop = (y / 24) * 5;
          let newStartMin = Math.floor(minutesFromTop / 5) * 5 + minMin;
          
          if (newStartMin < 0) newStartMin = 0;
          if (newStartMin > 48 * 60 - 5) newStartMin = 48 * 60 - 5;

          const task = tasks.find(t => t.id === taskIds[0]);
          if (!task) return;

          const oldStartMin = timeToMinutes(task.timeStart);
          const oldEndMin = timeToMinutes(task.timeEnd);
          const durationMin = oldEndMin > oldStartMin ? oldEndMin - oldStartMin : 30;

          let newEndMin = newStartMin + durationMin;
          if (newEndMin > 48 * 60) newEndMin = 48 * 60;

          const formatTime = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = (mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
          };

          setTasks(prevTasks => prevTasks.map(t => {
            if (taskIds.includes(t.id)) {
              return {
                ...t,
                subjectId: targetSubjectId,
                timeStart: formatTime(newStartMin),
                timeEnd: formatTime(newEndMin)
              };
            }
            return t;
          }));
        };

        return (
          <div className="flex flex-col h-full overflow-hidden bg-white">
            {unassignedTasks.length > 0 && (
              <div className="bg-amber-50 border-b border-amber-200 p-3 flex-shrink-0">
                <p className="text-xs font-bold text-amber-800 mb-2">時刻指定なし / 前準備タスク:</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                  {unassignedTasks.map(t => {
                    const subj = subjects.find(s => s.id === t.subjectId);
                    return (
                      <TaskItem 
                        key={t.id} 
                        task={t} 
                        subject={subj} 
                        viewType="checklist" 
                        onToggle={handleToggleTask} 
                        onUpdateTask={handleUpdateTask}
                        showSubjectLabel={targetSubjectIds.length > 1}
                      />
                    );
                  })}
                </div>
              </div>
            )}

            <div className="flex-1 overflow-y-auto relative no-scrollbar">
              <div className="flex min-w-full">
                <div className="w-20 md:w-24 flex-shrink-0 bg-gray-50 border-r border-gray-300 sticky left-0 z-20 select-none">
                  <div className="h-10 border-b border-gray-300 bg-gray-100 sticky top-0 z-30 flex items-center justify-center font-bold text-xs text-gray-500">
                    時刻
                  </div>
                  {slots.map(slot => (
                    <div 
                      key={slot.timeStr} 
                      className={`time-slot-row text-right pr-2 text-xs font-mono flex items-center justify-end ${
                        slot.isHourStart 
                          ? 'time-slot-hour-start font-black text-gray-900 bg-gray-200/50' 
                          : 'border-t border-gray-100 text-gray-500'
                      }`}
                    >
                      {slot.timeStr}
                    </div>
                  ))}
                </div>

                <div className="flex-1 flex overflow-x-auto">
                  {activeSubjs.map(subj => {
                    const subjTasks = dayTasks.filter(t => t.subjectId === subj.id);

                    return (
                      <div key={subj.id} className="flex-1 min-w-[280px] border-r border-gray-200 bg-white relative">
                        <div className={`h-10 sticky top-0 z-10 bg-${subj.color}-100 border-b border-${subj.color}-200 px-3 flex items-center justify-center font-bold text-xs text-${subj.color}-900 shadow-sm`}>
                          <span className={`w-2.5 h-2.5 rounded-full bg-${subj.color}-500 mr-2`}></span>
                          <span>{subj.name} ({subj.subjectId})</span>
                        </div>

                        <div 
                          className="relative"
                          onDragOver={onDragOver}
                          onDrop={(e) => onDrop(e, subj.id)}
                        >
                          {slots.map(slot => (
                            <div 
                              key={slot.timeStr} 
                              className={`time-slot-row ${
                                slot.isHourStart ? 'time-slot-hour-start bg-gray-50/50' : 'border-t border-gray-100'
                              }`}
                            />
                          ))}

                          <div className="absolute inset-0 p-1 pointer-events-none">
                            {(() => {
                              const groups = {};
                              subjTasks.forEach(t => {
                                const startMin = timeToMinutes(t.timeStart);
                                if (startMin < 0) return;
                                const key = `${t.timeStart}-${t.timeEnd}`;
                                if (!groups[key]) groups[key] = [];
                                groups[key].push(t);
                              });

                              return Object.values(groups).map(group => {
                                const firstTask = group[0];
                                const startMin = timeToMinutes(firstTask.timeStart);
                                const endMin = timeToMinutes(firstTask.timeEnd);
                                const durationMin = (endMin > startMin) ? (endMin - startMin) : 30;

                                const topPx = ((startMin - minMin) / 5) * 24;
                                const isShort = durationMin <= 10;
                                const heightPx = Math.max((durationMin / 5) * 24 - 2, 22);

                                const parsedTexts = group.map(t => processPlaceholders(t.task, subj));
                                const combinedText = parsedTexts.join(' ・ ');
                                
                                const allChecked = group.every(t => t.checked);
                                const groupIds = group.map(t => t.id);

                                return (
                                  <div
                                    key={groupIds.join(',')}
                                    draggable={true}
                                    onDragStart={(e) => onDragStart(e, groupIds)}
                                    onClick={() => handleToggleTaskGroup(groupIds)}
                                    style={{ top: `${topPx + 1}px`, height: `${heightPx}px` }}
                                    className={`absolute left-1 right-1 rounded-lg border-2 px-1.5 shadow-sm pointer-events-auto cursor-pointer transition-colors duration-150 flex items-center justify-between overflow-hidden ${
                                      allChecked 
                                        ? 'completed-task border-gray-300' 
                                        : `active-task bg-white border-${subj.color}-300 hover:border-${subj.color}-500 hover:shadow-md cursor-grab active:cursor-grabbing`
                                    }`}
                                  >
                                    <div className={`min-w-0 flex-1 flex ${isShort ? 'flex-row items-center space-x-1.5' : 'flex-col py-0.5 justify-start h-full'}`}>
                                      <div className={`text-[10px] font-mono font-bold text-gray-500 ${isShort ? 'flex-shrink-0' : 'mb-0.5 leading-none mt-0.5'}`}>
                                        {firstTask.timeStart}{firstTask.timeEnd && firstTask.timeEnd !== '-' && !isShort ? ` - ${firstTask.timeEnd}` : ''}
                                        {group.length > 1 && <span className="ml-1 bg-gray-200 text-gray-600 px-1 rounded text-[8px] font-black">{group.length}</span>}
                                      </div>
                                      <div className={`text-xs font-semibold truncate ${allChecked ? 'text-gray-400' : 'text-gray-800'} ${isShort ? 'leading-none' : 'leading-snug'}`}>
                                        {combinedText}
                                      </div>
                                    </div>
                                    <div className="flex-shrink-0 ml-1 flex items-center">
                                      <div className={`w-3.5 h-3.5 rounded flex items-center justify-center border ${
                                        allChecked ? 'bg-gray-400 border-gray-400 text-white' : `border-${subj.color}-400`
                                      }`}>
                                        {allChecked && <i className="fa-solid fa-check text-[8px]"></i>}
                                      </div>
                                    </div>
                                  </div>
                                );
                              });
                            })()}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderChecklistView = (targetSubjectIds) => {
        // チェックリストでは「スケジュールのみ」に設定されたタスクを除外して描画する
        const filteredTasks = tasks.filter(t => t.day === selectedDay && targetSubjectIds.includes(t.subjectId) && t.visibility !== 'schedule_only')
                                   .sort((a, b) => timeToMinutes(a.timeStart) - timeToMinutes(b.timeStart));

        // ★修正2: チェックリストの時間帯ごとのグループ化と見出し出力
        const unassignedTasks = filteredTasks.filter(t => timeToMinutes(t.timeStart) < 0);
        const timedTasks = filteredTasks.filter(t => timeToMinutes(t.timeStart) >= 0);
        let currentHour = null;

        return (
          <div className="h-full overflow-y-auto p-5 bg-gray-50 no-scrollbar">
            <div className="max-w-3xl mx-auto pb-20">
              <div className="flex items-center justify-between py-2 mb-4 border-b-2 border-gray-300">
                <h3 className="text-base font-bold text-gray-800 flex items-center">
                  <span className="w-3 h-3 rounded-full bg-emerald-500 mr-2"></span>
                  {selectedDay} のチェックリスト
                </h3>
                <span className="text-xs font-mono text-gray-400">計 {filteredTasks.length}件</span>
              </div>

              <div className="space-y-4">
                {unassignedTasks.length > 0 && (
                  <div className="mb-6">
                    <h4 className="text-lg font-black text-gray-700 mb-3 border-b-2 border-gray-200 pb-1">時間指定なし / 前準備</h4>
                    <div className="space-y-2">
                      {unassignedTasks.map(task => {
                        const subject = subjects.find(s => s.id === task.subjectId);
                        return (
                          <TaskItem 
                            key={task.id} 
                            task={task} 
                            subject={subject} 
                            viewType="checklist" 
                            onToggle={handleToggleTask}
                            onUpdateTask={handleUpdateTask}
                            showSubjectLabel={targetSubjectIds.length > 1}
                          />
                        );
                      })}
                    </div>
                  </div>
                )}

                {timedTasks.map((task) => {
                  const startMin = timeToMinutes(task.timeStart);
                  const hour = Math.floor(startMin / 60);
                  const hourStr = `${hour.toString().padStart(2, '0')}:00`;
                  
                  // 時間帯（時）が変わったときだけ見出しを表示するフラグ
                  const showHeader = currentHour !== hour;
                  currentHour = hour;

                  const subject = subjects.find(s => s.id === task.subjectId);
                  
                  return (
                    <React.Fragment key={task.id}>
                      {showHeader && (
                        <div className="mt-6 mb-3 border-b-2 border-gray-200 pb-1 flex items-end">
                          <span className="text-2xl font-black text-gray-800 tracking-tight leading-none">{hourStr}</span>
                        </div>
                      )}
                      <TaskItem 
                        task={task} 
                        subject={subject} 
                        viewType="checklist" 
                        onToggle={handleToggleTask}
                        onUpdateTask={handleUpdateTask}
                        showSubjectLabel={targetSubjectIds.length > 1}
                      />
                    </React.Fragment>
                  );
                })}

                {filteredTasks.length === 0 && (
                  <div className="text-center text-gray-400 py-16 text-sm font-bold">この日のタスクはありません</div>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col h-screen bg-gray-100 relative">
          <input 
            type="file" 
            accept=".csv, .xlsx" 
            style={{ display: 'none' }} 
            ref={fileInputRef} 
            onChange={handleFileChange} 
          />
          <input 
            type="file" 
            accept=".csv, .xlsx" 
            style={{ display: 'none' }} 
            ref={individualFileInputRef} 
            onChange={handleIndividualFileChange} 
          />

          {toastMessage && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold flex items-center space-x-2 animate-bounce">
              <span>{toastMessage}</span>
            </div>
          )}

          <div className="bg-white shadow-sm z-20 px-5 py-3 flex flex-wrap items-center justify-between border-b border-gray-200">
            <div className="flex items-center space-x-4">
              <h1 className="text-lg font-black text-gray-800 flex items-center tracking-tight">
                <i className="fa-solid fa-list-check text-blue-600 mr-2 text-xl"></i>
                実験進行マネージャー
              </h1>
              
              {!isEditMode && (
                <div className="flex bg-gray-100 p-1 rounded-xl">
                  <button 
                    onClick={() => setViewType('schedule')} 
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      viewType === 'schedule' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <i className="fa-regular fa-calendar-days mr-1.5"></i>スケジュール表
                  </button>
                  <button 
                    onClick={() => setViewType('checklist')} 
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      viewType === 'checklist' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <i className="fa-solid fa-square-check mr-1.5"></i>チェックリスト
                  </button>
                </div>
              )}
            </div>

            <div className="flex items-center space-x-3">
              <div className="flex items-center bg-gray-50 border border-gray-200 rounded-lg p-1 space-x-2">
                <button
                  onClick={openSyncModal}
                  className={`px-3 py-1 rounded-md text-xs font-bold flex items-center transition ${
                    syncStatus === 'unconfigured' || syncStatus === 'error'
                      ? 'bg-red-50 text-red-700 border border-red-200 hover:bg-red-100'
                      : isSyncActive 
                        ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' 
                        : 'bg-white text-gray-700 border border-gray-200 hover:bg-gray-100'
                  }`}
                >
                  <i className={`fa-solid ${
                    syncStatus === 'unconfigured' || syncStatus === 'error' 
                      ? 'fa-triangle-exclamation text-red-500' 
                      : isSyncActive 
                        ? 'fa-rotate text-emerald-500 animate-spin' 
                        : 'fa-rotate text-gray-400'
                  } mr-1.5`}></i>
                  {syncStatus === 'unconfigured' 
                    ? '⚠️ Firebase未設定' 
                    : syncStatus === 'error'
                      ? '⚠️ 通信エラー'
                      : isSyncActive 
                        ? `同期中 #${activeSlotCode}` 
                        : '匿名同期'}
                </button>
                {isSyncActive && (
                  <button 
                    onClick={stopSync}
                    title="同期解除" 
                    className="text-gray-400 hover:text-red-500 text-xs px-1.5 py-0.5 rounded"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                )}
              </div>

              {!isEditMode && (
                <div className="flex items-center space-x-2 border-l border-gray-200 pl-3">
                  <div className="flex bg-gray-100 p-1 rounded-xl mr-2">
                    <button 
                      onClick={() => setDisplayMode('individual')} 
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                        displayMode === 'individual' ? 'bg-white shadow text-gray-800 font-bold' : 'text-gray-500'
                      }`} 
                      title="選択した被験者のみ"
                    >
                      <i className="fa-solid fa-user mr-1"></i>個別
                    </button>
                    <button 
                      onClick={() => setDisplayMode('columns')} 
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                        displayMode === 'columns' ? 'bg-white shadow text-gray-800 font-bold' : 'text-gray-500'
                      }`} 
                      title="全員を並べて表示"
                    >
                      <i className="fa-solid fa-table-columns mr-1"></i>並べて表示
                    </button>
                  </div>
                  
                  <div className="flex items-center space-x-1">
                    <button onClick={handleImportTemplateClick} className="px-3 py-1.5 bg-gray-50 text-gray-700 rounded-lg border border-gray-300 hover:bg-gray-100 text-xs font-bold transition">
                      <i className="fa-solid fa-file-import mr-1.5"></i>読込
                    </button>
                    <button onClick={handleExportTemplateClick} className="px-3 py-1.5 bg-gray-50 text-gray-700 rounded-lg border border-gray-300 hover:bg-gray-100 text-xs font-bold transition">
                      <i className="fa-solid fa-file-export mr-1.5"></i>保存
                    </button>
                    <button onClick={() => exportToExcel(tasks, subjects)} className="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 hover:bg-emerald-100 text-xs font-bold transition">
                      <i className="fa-solid fa-file-excel mr-1.5"></i>Excel
                    </button>
                  </div>
                </div>
              )}
              
              <button 
                onClick={() => setIsEditMode(!isEditMode)} 
                className={`ml-2 px-4 py-1.5 rounded-lg border transition text-xs font-bold shadow-sm ${
                  isEditMode ? 'bg-blue-600 text-white border-blue-700 hover:bg-blue-700' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'
                }`}
              >
                <i className={`fa-solid ${isEditMode ? 'fa-check' : 'fa-pen-to-square'} mr-1.5`}></i>
                {isEditMode ? '完了' : '編集モード'}
              </button>
            </div>
          </div>

          {/* ★修正4: 編集モードでもフェーズ/被験者タブを表示し、ページを分けるように変更 */}
          <div className="bg-gray-50 px-5 py-2 border-b border-gray-200 flex flex-wrap items-center justify-between gap-3 shadow-inner">
            <div className="flex items-center space-x-1 overflow-x-auto no-scrollbar">
              <span className="text-xs font-bold text-gray-400 mr-2 whitespace-nowrap">フェーズ:</span>
              {}
              {availableDays.map((day, index) => (
                <div key={day} className={`flex items-center rounded-lg transition-all whitespace-nowrap border ${
                  selectedDay === day
                    ? 'border-blue-600 bg-blue-600 shadow'
                    : 'border-gray-200 bg-white hover:bg-gray-100'
                }`}>
                  <button
                    onClick={() => setSelectedDay(day)}
                    className={`px-3 py-1 text-xs font-bold ${
                      selectedDay === day ? 'text-white' : 'text-gray-600'
                    }`}
                  >
                    {day}
                  </button>
                  {isEditMode && (
                    <div className={`flex items-center border-l px-1 h-full ${
                      selectedDay === day ? 'border-blue-500 bg-blue-700/30 text-white' : 'border-gray-200 bg-gray-50 text-gray-500'
                    }`}>
                      <button onClick={() => handleMoveDay(index, -1)} disabled={index === 0} className="p-1 hover:opacity-70 disabled:opacity-30 disabled:cursor-not-allowed">
                        <i className="fa-solid fa-caret-left text-[11px]"></i>
                      </button>
                      <button onClick={() => handleMoveDay(index, 1)} disabled={index === availableDays.length - 1} className="p-1 hover:opacity-70 disabled:opacity-30 disabled:cursor-not-allowed">
                        <i className="fa-solid fa-caret-right text-[11px]"></i>
                      </button>
                      <button onClick={() => handleDeleteDay(day)} className={`p-1 ml-0.5 ${selectedDay === day ? 'text-white hover:text-red-300' : 'text-red-400 hover:text-red-600'}`}>
                        <i className="fa-solid fa-xmark text-[11px]"></i>
                      </button>
                    </div>
                  )}
                </div>
              ))}
              {isEditMode && (
                <button onClick={() => openAddDayModal()} className="px-2.5 py-1 rounded-lg text-xs bg-white border border-dashed border-gray-300 text-gray-500 hover:bg-gray-100 font-bold whitespace-nowrap ml-1">
                  <i className="fa-solid fa-plus mr-1"></i>追加
                </button>
              )}
            </div>

            {(displayMode === 'individual' || isEditMode) && (
              <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar">
                <span className="text-xs font-bold text-gray-400 mr-1 whitespace-nowrap">被験者:</span>
                {subjects.map(subj => (
                  <button 
                    key={subj.id}
                    onClick={() => setSelectedSubjectId(subj.id)}
                    className={`flex items-center px-3 py-1 rounded-full text-xs font-bold border transition-all whitespace-nowrap ${
                      selectedSubjectId === subj.id 
                        ? `bg-${subj.color}-100 border-${subj.color}-300 text-${subj.color}-900 shadow-sm ring-2 ring-${subj.color}-400/30` 
                        : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-100'
                    }`}
                  >
                    <span className={`w-2 h-2 rounded-full bg-${subj.color}-500 mr-1.5`}></span>
                    {subj.name || '未設定'} ({subj.subjectId})
                  </button>
                ))}
                <button onClick={handleAddSubject} className="px-2.5 py-1 rounded-full text-xs bg-white border border-dashed border-gray-300 text-gray-500 hover:bg-gray-100 font-bold whitespace-nowrap">
                  <i className="fa-solid fa-plus mr-1"></i>追加
                </button>
              </div>
            )}
          </div>

          <div className="flex-1 overflow-hidden relative bg-white">
            {isEditMode ? (
              <div className="h-full overflow-y-auto p-6 bg-gray-100">
                <div className="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-12">
                  <div className="bg-gray-50 px-6 py-4 border-b border-gray-200 flex flex-wrap justify-between items-center gap-4">
                    {subjects.find(s=>s.id===selectedSubjectId) && (() => {
                      const s = subjects.find(s=>s.id===selectedSubjectId);
                      return (
                        <>
                          <div className="flex items-center space-x-4">
                            <div>
                              <label className="text-[10px] font-bold text-gray-400 uppercase block">被験者名</label>
                              <input type="text" value={s.name} onChange={e => handleUpdateSubject(s.id, 'name', e.target.value)} className="border border-gray-300 rounded-lg px-2.5 py-1 text-sm font-bold w-32 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                              <label className="text-[10px] font-bold text-gray-400 uppercase block">被験者ID</label>
                              <input type="text" value={s.subjectId} onChange={e => handleUpdateSubject(s.id, 'subjectId', e.target.value.toUpperCase())} className="border border-gray-300 rounded-lg px-2.5 py-1 text-sm font-mono w-28 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                              <label className="text-[10px] font-bold text-gray-400 uppercase block">ｻﾌﾞｼﾞｪｸﾄNo.</label>
                              <input type="text" value={s.subjectNo || ''} onChange={e => handleUpdateSubject(s.id, 'subjectNo', e.target.value)} className="border border-gray-300 rounded-lg px-2.5 py-1 text-sm font-mono w-20 focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <button onClick={() => handleDeleteSubject(s.id)} className="mt-3 text-red-500 text-xs font-bold hover:underline">
                              <i className="fa-solid fa-trash mr-1"></i>削除
                            </button>
                          </div>
                          
                          <div className="flex items-center space-x-2">
                            <button onClick={handleImportIndividualTemplateClick} className="px-3 py-1.5 bg-white text-gray-700 rounded-lg border border-gray-300 hover:bg-gray-100 text-xs font-bold transition shadow-sm">
                              <i className="fa-solid fa-file-import mr-1.5"></i>タスク読込
                            </button>
                            <button onClick={handleExportIndividualTemplate} className="px-3 py-1.5 bg-white text-gray-700 rounded-lg border border-gray-300 hover:bg-gray-100 text-xs font-bold transition shadow-sm">
                              <i className="fa-solid fa-file-export mr-1.5"></i>タスク保存
                            </button>
                          </div>
                        </>
                      );
                    })()}
                  </div>

                  <div className="p-6">
                    <div className="grid grid-cols-12 gap-1 font-bold text-gray-400 text-[10px] px-1 mb-2 text-center">
                      <div className="col-span-2">日 / フェーズ</div>
                      <div className="col-span-2">開始時刻</div>
                      <div className="col-span-2">終了時刻</div>
                      <div className="col-span-3">タスク内容</div>
                      <div className="col-span-2">表示先</div>
                      <div className="col-span-1">操作</div>
                    </div>
                    
                    <div className="space-y-2">
                      {/* ★修正4: 選択中の被験者 ＋ 選択中の日でフィルタし、時間順にソート */}
                      {tasks
                        .filter(t => t.subjectId === selectedSubjectId && t.day === selectedDay)
                        .sort((a, b) => timeToMinutes(a.timeStart) - timeToMinutes(b.timeStart))
                        .map((task) => (
                        <div key={task.id} className="grid grid-cols-12 gap-1 items-center bg-gray-50 p-2 rounded-xl border border-gray-200 hover:border-gray-300 transition">
                          <div className="col-span-2">
                            <select 
                              value={task.day} 
                              onChange={e => handleDayChange(task.id, e.target.value)}
                              className="w-full border border-gray-300 rounded-lg px-1 py-1.5 text-[11px] font-bold bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                              {availableDays.map(d => (
                                <option key={d} value={d}>{d}</option>
                              ))}
                              <option value="__ADD_NEW__" className="text-blue-600 font-bold">+ 追加...</option>
                            </select>
                          </div>

                          <div className="col-span-2">
                            <select 
                              value={task.timeStart} 
                              onChange={e => handleUpdateTask(task.id, 'timeStart', e.target.value)} 
                              className="w-full border border-gray-300 rounded-lg px-1 py-1.5 text-xs font-mono bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                              {TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>

                          <div className="col-span-2">
                            <select 
                              value={task.timeEnd} 
                              onChange={e => handleUpdateTask(task.id, 'timeEnd', e.target.value)} 
                              className="w-full border border-gray-300 rounded-lg px-1 py-1.5 text-xs font-mono bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                              {TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>

                          {/* ★修正3: タスク内容をテキストエリア(textarea)に変更し折り返し対応 */}
                          <div className="col-span-3">
                            <textarea 
                              value={task.task} 
                              onChange={e => handleUpdateTask(task.id, 'task', e.target.value)} 
                              className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-xs bg-white focus:ring-2 focus:ring-blue-500 outline-none leading-relaxed" 
                              placeholder="タスク内容" 
                              rows="2"
                              style={{ minHeight: '42px', resize: 'vertical' }}
                            />
                          </div>

                          <div className="col-span-2">
                            <select 
                              value={task.visibility || 'both'} 
                              onChange={e => handleUpdateTask(task.id, 'visibility', e.target.value)} 
                              className="w-full border border-gray-300 rounded-lg px-1 py-1.5 text-[10px] font-bold bg-white focus:ring-2 focus:ring-blue-500 outline-none text-gray-600"
                            >
                              <option value="both">両方表示</option>
                              <option value="schedule_only">ｽｹｼﾞｭｰﾙのみ</option>
                              <option value="checklist_only">ﾁｪｯｸﾘｽﾄのみ</option>
                            </select>
                          </div>

                          <div className="col-span-1 flex flex-col justify-center items-center space-y-1">
                            <button onClick={() => handleDuplicateTask(task)} title="複製" className="p-1 text-blue-500 hover:text-blue-700 rounded hover:bg-blue-100 transition">
                              <i className="fa-regular fa-copy text-xs"></i>
                            </button>
                            <button onClick={() => handleDeleteTask(task.id)} title="削除" className="p-1 text-red-400 hover:text-red-600 rounded hover:bg-red-50 transition">
                              <i className="fa-solid fa-trash text-xs"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                      
                      {tasks.filter(t => t.subjectId === selectedSubjectId && t.day === selectedDay).length === 0 && (
                        <div className="text-center py-8 text-gray-400 text-sm font-bold">
                          {selectedDay} のタスクはありません
                        </div>
                      )}
                    </div>
                    
                    <button 
                      onClick={() => handleAddTask(selectedSubjectId)} 
                      className="mt-5 w-full py-3 border-2 border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 hover:text-gray-700 transition font-bold text-xs flex items-center justify-center"
                    >
                      <i className="fa-solid fa-plus mr-2"></i> 新しいタスク枠を追加
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="h-full">
                {viewType === 'schedule' ? (
                  render5MinTimelineSchedule(displayMode === 'individual' ? [selectedSubjectId] : subjects.map(s => s.id))
                ) : (
                  renderChecklistView(displayMode === 'individual' ? [selectedSubjectId] : subjects.map(s => s.id))
                )}
              </div>
            )}
          </div>
          
          <Modal 
            isOpen={modalConfig.isOpen}
            title={modalConfig.title}
            message={modalConfig.message}
            onConfirm={modalConfig.onConfirm}
            onCancel={modalConfig.onCancel}
          >
            {modalConfig.content}
          </Modal>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
